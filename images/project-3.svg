<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260">
  <!-- 흑백 그레인 추상 이미지: 사선으로 흐르는 빛줄기 — 확산·로드맵 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6 2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="ga"><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="ga" mode="overlay" result="b"/>
      <feComposite in="b" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <rect width="800" height="260" fill="url(#bg)"/>
    <g transform="rotate(-18 400 130)" filter="url(#soft)" fill="url(#streak)">
      <rect x="-100" y="40" width="1000" height="10" opacity="0.5"/>
      <rect x="-100" y="78" width="1000" height="34" opacity="0.85"/>
      <rect x="-100" y="128" width="1000" height="6" opacity="0.6"/>
      <rect x="-100" y="150" width="1000" height="22" opacity="0.4"/>
      <rect x="-100" y="196" width="1000" height="3" opacity="0.7"/>
      <rect x="-100" y="214" width="1000" height="14" opacity="0.3"/>
    </g>
  </g>
</svg>
