<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260">
  <!-- 흑백 그레인 추상 이미지: 동심원(레코드판) — 체계·표준화 -->
  <defs>
    <radialGradient id="light" cx="70%" cy="40%" r="70%">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="disc" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="0.6" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="ga"><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="ga" mode="overlay" result="b"/>
      <feComposite in="b" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <rect width="800" height="260" fill="url(#light)"/>
    <circle cx="560" cy="150" r="190" fill="url(#disc)"/>
    <g fill="none" stroke="#0a0a0a" stroke-opacity="0.55">
      <circle cx="560" cy="150" r="175" stroke-width="2"/>
      <circle cx="560" cy="150" r="160" stroke-width="1.5"/>
      <circle cx="560" cy="150" r="146" stroke-width="2.5"/>
      <circle cx="560" cy="150" r="130" stroke-width="1"/>
      <circle cx="560" cy="150" r="118" stroke-width="2"/>
      <circle cx="560" cy="150" r="104" stroke-width="1.5"/>
      <circle cx="560" cy="150" r="90" stroke-width="3"/>
    </g>
    <circle cx="560" cy="150" r="58" fill="#111"/>
    <circle cx="560" cy="150" r="6" fill="#d8d8d8"/>
    <rect x="0" y="0" width="800" height="260" fill="#000" opacity="0.15"/>
  </g>
</svg>
