<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260">
  <!-- 흑백 그레인 추상 이미지: 하프톤 점 패턴이 번지는 형태 — 데이터 분석 -->
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3.6" fill="#f0f0f0"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
    <mask id="blob">
      <rect width="800" height="260" fill="#000"/>
      <g filter="url(#blur)" fill="#fff">
        <ellipse cx="300" cy="120" rx="170" ry="95"/>
        <ellipse cx="520" cy="170" rx="140" ry="70"/>
        <circle cx="660" cy="70" r="55"/>
      </g>
    </mask>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.02" numOctaves="1" seed="8" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="14" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="ga"><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feBlend in="d" in2="ga" mode="overlay" result="b"/>
      <feComposite in="b" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <rect width="800" height="260" fill="#080808"/>
    <rect width="800" height="260" fill="url(#dots)" mask="url(#blob)"/>
  </g>
</svg>
